<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privex</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 360px;
      max-height: 560px;
      margin: 0;
      padding: 16px;
      color: #e8f2f7;
      background: #10212b;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 18px; }
    #maskCount { color: #6dd6b0; font-weight: 700; }
    #status { margin: 0 0 12px; color: #a9bfca; }
    #masksList { display: grid; gap: 9px; max-height: 390px; overflow: auto; }
    .mask-item { padding: 11px; border: 1px solid #2b4653; border-radius: 9px; background: #172d38; }
    .mask-type { margin-bottom: 8px; color: #6dd6b0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .mapping { display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: start; }
    .mapping > div { min-width: 0; }
    .label { display: block; margin-bottom: 3px; color: #91a9b5; font-size: 10px; }
    .value { overflow-wrap: anywhere; color: #f5f8fa; }
    code.value { color: #a8dcff; font: 11px/1.45 ui-monospace, Consolas, monospace; }
    .arrow { padding-top: 17px; color: #6dd6b0; }
    .empty-state { padding: 22px 12px; color: #a9bfca; text-align: center; border: 1px dashed #2b4653; border-radius: 9px; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; }
    #totalCount { color: #91a9b5; font-size: 12px; }
    button { padding: 7px 11px; color: #e8f2f7; background: #203b48; border: 1px solid #3a5968; border-radius: 7px; cursor: pointer; }
    button:hover { background: #2a4b5a; }
    button.primary { background: #047CBC; border-color: #047CBC; color: #fff; font-weight: 600; }
    button.primary:hover { background: #03689C; }
  </style>
</head>
<body>
  <header>
    <h1>🔒 Privex · Replacements</h1>
    <span id="maskCount">0</span>
  </header>
  <p id="status" role="status">Loading…</p>
  <main id="masksList" aria-live="polite"></main>
  <footer>
    <span id="totalCount"></span>
    <button id="manageBtn" class="primary" type="button">Manage saved data</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
