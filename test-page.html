<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privex Test Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .box {
        width: min(90vw, 700px);
        background: white;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      }

      textarea {
        width: 100%;
        min-height: 160px;
        padding: 14px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <textarea placeholder="Type a message here...">Please email support@privex.ai or call +1 415 555 0199.</textarea>
    </div>
  </body>
</html>
